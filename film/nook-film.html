    var ctx = this.ctx, f = this.hz(ev.n), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 2600; lp.Q.value = 0.4;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(Math.max(ev.v, 0.0002), at + 0.012);
    g.gain.exponentialRampToValueAtTime(Math.max(ev.v * 0.35, 0.0002), at + 0.35); g.gain.exponentialRampToValueAtTime(0.0001, at + ev.d);
    var o1 = ctx.createOscillator(); o1.type = "sine"; o1.frequency.value = f;
    var o2 = ctx.createOscillator(); o2.type = "triangle"; o2.frequency.value = f * 2; var g2 = ctx.createGain(); g2.gain.value = 0.22;
    var o3 = ctx.createOscillator(); o3.type = "sine"; o3.frequency.value = f * 3.01; var g3 = ctx.createGain(); g3.gain.value = 0.06;
    o1.connect(g); o2.connect(g2); g2.connect(g); o3.connect(g3); g3.connect(g); g.connect(lp); lp.connect(bus);
    [o1, o2, o3].forEach(function (o) { o.start(at); o.stop(at + ev.d + 0.1); });
  },
  pad: function (bus, ev, at, late) {
    var ctx = this.ctx, f = this.hz(ev.n), lp = ctx.createBiquadFilter(), g = ctx.createGain();
    lp.type = "lowpass"; lp.frequency.value = 560;
    var atk = late ? 0.05 : 1.3, dur = Math.max(0.2, ev.d - (late ? at - 0 : 0));
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(Math.max(ev.v, 0.0002), at + atk);
    g.gain.setValueAtTime(Math.max(ev.v, 0.0002), at + Math.max(atk, dur - 1.6)); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    [-5, 5].forEach(function (cents) {
      var o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f; o.detune.value = cents; o.connect(g); o.start(at); o.stop(at + dur + 0.1);
    });
    g.connect(lp); lp.connect(bus);
  },
  click: function (bus, ev, at) {
    var ctx = this.ctx, s = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = this.noise; bp.type = "bandpass"; bp.frequency.value = 1900 + Math.random() * 900; bp.Q.value = 0.9; g.gain.value = ev.v * 2.4;
    s.connect(bp); bp.connect(g); g.connect(bus); s.start(at);
  },
  tick: function (bus, ev, at) {
    var ctx = this.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(760, at); o.frequency.exponentialRampToValueAtTime(520, at + 0.05);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(ev.v, at + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.09);
    o.connect(g); g.connect(bus); o.start(at); o.stop(at + 0.12);
    this.click(bus, { v: ev.v * 0.8 }, at);
  },
  chime: function (bus, ev, at) {
    var ctx = this.ctx;
    [[784, 1], [1176, 0.45], [1568, 0.28], [2352, 0.12]].forEach(function (p) {
      var o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine"; o.frequency.value = p[0];
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(ev.v * p[1], at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + 3.4);
      o.connect(g); g.connect(bus); o.start(at); o.stop(at + 3.5);
    });
  }
};

/* ===================== the player ===================== */
var params = new URLSearchParams(location.search);
var T = parseFloat(params.get("t")) || 0;
var still = params.get("still") === "1";
var playing = false, last = 0, hudUntil = 0, ended = false;

function fit() {
  var w = innerWidth, h = innerHeight, s = Math.min(w / 1920, h / 1080);
  Q.stage.style.transform = "translate(" + ((w - 1920 * s) / 2) + "px," + ((h - 1080 * s) / 2) + "px) scale(" + s + ")";
}
addEventListener("resize", fit); fit();

function hud(text) { Q.hud.textContent = text; Q.hud.style.opacity = 0.75; hudUntil = performance.now() + 2200; }
function play() {
  if (T >= DURATION - 0.05) T = 0;
  playing = true; last = performance.now(); Sound.start(T); ended = false;
}
function pause() { playing = false; Sound.stop(); hud("paused · space to play · r restart · ← → seek · m mute · f full screen"); }
function seek(to) { T = clamp(to, 0, DURATION); if (playing) Sound.start(T); render(T); }

function loop(now) {
  if (playing) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now; T += dt;
    if (T >= DURATION) { T = DURATION; playing = false; ended = true; Sound.stop(); hud("the end · r to watch again"); }
  }
  try { render(T); } catch (e) { $("err").textContent = e.stack || String(e); }
  if (hudUntil && now > hudUntil) { Q.hud.style.opacity = 0; hudUntil = 0; }
  requestAnimationFrame(loop);
}

Q.start.addEventListener("click", function () { Q.start.style.display = "none"; play(); });
addEventListener("keydown", function (e) {
  if (Q.start.style.display !== "none" && !still) { if (e.key === " " || e.key === "Enter") { Q.start.style.display = "none"; play(); e.preventDefault(); } return; }
  if (e.key === " ") { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === "r" || e.key === "R") { T = 0; play(); }
  else if (e.key === "ArrowRight") seek(T + 5);
  else if (e.key === "ArrowLeft") seek(T - 5);
  else if (e.key === "m" || e.key === "M") { Sound.mute(!Sound.muted); hud(Sound.muted ? "muted" : "sound on"); }
  else if (e.key === "f" || e.key === "F") { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
});
if (still) { Q.start.style.display = "none"; Q.hud.style.display = "none"; }
render(T);
requestAnimationFrame(loop);
window.__film = { render: render, setT: function (t) { T = t; render(t); }, sound: Sound, state: function () { return { T: T, playing: playing }; } };
})();
</script>
