{# a nook map: {{ nmap(lat, lon, zoom, markers) }}. markers: [{lat, lon, label, href, on}] #}
{% macro nmap(lat, lon, zoom, markers=[], big=False, lines=[]) %}
<div class="nmap{% if big %} big{% endif %}" data-lat="{{ lat }}" data-lon="{{ lon }}" data-zoom="{{ zoom }}" tabindex="0" role="application" aria-label="map">
  <script type="application/json" class="mapdata">{{ {"markers": markers, "lines": lines} | tojson }}</script>
  <div class="tiles"></div>
  <div class="pins"></div>
  <div class="ctl"><button type="button" data-z="1" aria-label="zoom in">+</button><button type="button" data-z="-1" aria-label="zoom out">&minus;</button></div>
  <div class="credit"><button type="button" class="info" aria-label="map credit" title="map credit" aria-expanded="true">i</button><span class="text">&copy; <a href="{{ map_credit_url }}" rel="noreferrer">{{ map_credit | replace("© ", "") }}</a> &middot; <a href="https://openfreemap.org" rel="noreferrer">OpenFreeMap</a> &middot; <a href="https://openmaptiles.org" rel="noreferrer">OpenMapTiles</a></span></div>
</div>
<noscript><p class="map-credit-static">{{ map_credit }}</p></noscript>
<script src="{{ url_for('static', filename='map.js') }}"></script>
{% endmacro %}
