# News outlets, grouped by political wing.
#
# The grouping is my rough reading of public media-bias ratings (AllSides, Media Bias/Fact
# Check). It is an opinion, not a fact, and people disagree about plenty of these. Move an
# outlet to another wing, or add and remove feeds, by editing this file. Restart to apply.
# wing is one of: far-left, left, centre, right, far-right

# far left
[[feed]]
name = "Jacobin"
url = "https://jacobin.com/feed"
wing = "far-left"

