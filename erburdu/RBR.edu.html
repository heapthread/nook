<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RBR.edu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: fixed sidebar + sticky top bar + one scrolling content column; lessons open as a focused full-screen view */
:root{
  --bg:#FBF8F3;--surface:#FFFFFF;--subtle:#F3EEE6;--border:#E7E0D4;--strong:#D2C9B8;
  --text:#14213D;--text2:#3F4B66;--muted:#5F6B82;
  --primary:#2F5BEA;--primary-hover:#2449C4;--primary-soft:#E8EEFF;--primary-ink:#1E3FA8;--on-primary:#FFFFFF;--primary-shadow:#1E3FA8;
  --mint:#1FA77D;--mint-soft:#DDF5EC;--mint-ink:#0B6A4E;--mint-shadow:#12805E;
  --yellow:#F2B33D;--yellow-soft:#FFF1D1;--yellow-ink:#6F4A00;--yellow-shadow:#C98F1A;
  --error:#D64545;--error-soft:#FCE4E4;--error-ink:#8F2828;
  --locked:#A3ABBB;--locked-soft:#ECEEF2;
  --shadow:0 1px 2px rgba(20,33,61,.05),0 6px 18px rgba(20,33,61,.06);--shadow-pop:0 12px 36px rgba(20,33,61,.18);
  color-scheme:light;--display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 15px/1.55 var(--body);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:32px;font-weight:800}h2{font-size:24px;font-weight:700}h3{font-size:20px;font-weight:700}h4{font-size:16px;font-weight:700;font-family:var(--body)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
svg{display:block}
.ic{flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}.small{font-size:13px}.over{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font:800 21px var(--display);padding:4px 8px 20px;color:var(--text)}
.logo i{width:34px;height:34px;border-radius:11px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-style:normal}
.logo b{color:var(--primary);font-weight:800}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;color:var(--text2);text-align:left;width:100%}
.nav:hover{background:var(--subtle)}
.nav[aria-current="page"]{background:var(--primary-soft);color:var(--primary-ink)}
.klasse{margin-top:auto;background:var(--subtle);border-radius:14px;padding:12px 14px}
.klasse b{display:block;font-size:13px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 32px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px)}
.search{position:relative;flex:0 1 420px}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--border);background:var(--surface);padding:0 16px 0 44px;font:inherit;color:var(--text)}
.search .ic{position:absolute;left:16px;top:12px;color:var(--muted)}
.results{position:absolute;top:50px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-pop);padding:6px;z-index:30}
.results button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:10px 12px;border-radius:10px;gap:10px}
.results button:hover{background:var(--subtle)}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.pill.y{background:var(--yellow-soft);color:var(--yellow-ink)}
.iconbtn{position:relative;width:44px;height:44px;border-radius:999px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center}
.dot{position:absolute;top:9px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--error)}
.me{display:flex;align-items:center;gap:10px;height:44px;border-radius:999px;border:1px solid var(--border);background:var(--surface);padding:0 12px 0 6px;font-weight:600}
.av{width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:12px;font-weight:700}
.menuwrap{position:relative}
.pop{position:absolute;right:0;top:52px;width:288px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-pop);padding:8px;z-index:40}
.pop .hd{display:flex;gap:12px;align-items:center;padding:12px}
.pop .hd .av{width:44px;height:44px;font-size:15px}
.pop button.it{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:10px;color:var(--text2);font-weight:500}
.pop button.it:hover{background:var(--subtle)}
.pop hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.main{padding:8px 32px 48px;display:flex;flex-direction:column;gap:24px;min-width:0}
.sub{color:var(--text2);font-size:17px;margin-top:6px}

/* primitives */
.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:24px;box-shadow:var(--shadow);min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;font-weight:700;padding:12px 20px;line-height:1.2;transition:transform .06s,box-shadow .06s,background .15s;white-space:nowrap}
.btn.lg{padding:15px 26px;font-size:16px}
.btn.p{background:var(--primary);color:var(--on-primary);box-shadow:0 4px 0 var(--primary-shadow)}
.btn.p:hover{background:var(--primary-hover)}
.btn.p:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-shadow)}
.btn.g{background:var(--mint);color:#fff;box-shadow:0 4px 0 var(--mint-shadow)}
.btn.g:active{transform:translateY(3px);box-shadow:0 1px 0 var(--mint-shadow)}
.btn.s{background:var(--surface);border:1.5px solid var(--strong);color:var(--text)}
.btn.s:hover{background:var(--subtle)}
.btn.t{color:var(--primary-ink);padding-inline:12px}.btn.t:hover{background:var(--primary-soft)}
.btn[disabled]{background:var(--locked-soft);color:var(--locked);box-shadow:none;cursor:not-allowed;border:0}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.b-blue{background:var(--primary-soft);color:var(--primary-ink)}.b-mint{background:var(--mint-soft);color:var(--mint-ink)}.b-yellow{background:var(--yellow-soft);color:var(--yellow-ink)}.b-neutral{background:var(--subtle);color:var(--text2)}.b-red{background:var(--error-soft);color:var(--error-ink)}
.bar{height:8px;border-radius:99px;background:var(--subtle);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .5s}
.bar.m i{background:var(--mint)}.bar.y i{background:var(--yellow)}
.row{display:flex;align-items:center;gap:12px}.col{display:flex;flex-direction:column}
.g12{gap:12px}.g16{gap:16px}.g24{gap:24px}
.grid{display:grid;gap:20px}
.cols2{grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.wrapflex{flex-wrap:wrap}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:center}
.ihero{display:grid;grid-template-columns:minmax(220px,340px) minmax(0,1fr);gap:28px;align-items:center}
.hero .ill{background:var(--primary-soft);border-radius:18px;padding:10px}
.stat{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.stat .si{width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.stat b{font:800 24px/1 var(--display);display:block}
.mini{display:flex;gap:0;justify-content:space-between;align-items:flex-start}
.mini .n{display:flex;flex-direction:column;align-items:center;gap:8px;width:20%;text-align:center;font-size:12px;font-weight:600;color:var(--text2)}
.node-s{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.nd-done{background:var(--mint);color:#fff;box-shadow:0 4px 0 var(--mint-shadow)}
.nd-cur{background:var(--primary);color:var(--on-primary);box-shadow:0 4px 0 var(--primary-shadow),0 0 0 9px var(--primary-soft)}
.nd-lock{background:#EEE8DC;color:var(--locked);border:3px solid var(--strong);box-shadow:0 4px 0 var(--strong)}
.nd-perf{background:var(--yellow);color:#4a3200;box-shadow:0 4px 0 var(--yellow-shadow)}
.legend i{box-shadow:none!important;border:0!important}
.path5{display:flex;align-items:flex-start;padding:6px 0 4px}
.path5 .n{display:flex;flex-direction:column;align-items:center;gap:14px;width:132px;flex:none;text-align:center;font-weight:600;font-size:15px;line-height:1.3;padding:8px 0 0}
.path5 .n .node-s{width:64px;height:64px}
.path5 .n.l{color:var(--muted)}
.path5 .seg{flex:1;min-width:20px;height:6px;border-radius:99px;background:var(--strong);margin-top:35px}
.path5 .seg.on{background:var(--mint)}
.reco{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--border);border-radius:20px;padding:18px;background:var(--surface);transition:border-color .15s,transform .15s}
.reco:hover{border-color:var(--primary);transform:translateY(-2px)}
.week{display:flex;align-items:flex-end;justify-content:space-between;height:120px;gap:8px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;justify-content:flex-end;height:100%;font-size:12px;font-weight:600;color:var(--muted)}
.week i{display:block;width:100%;max-width:36px;border-radius:8px;background:var(--primary-soft);min-height:6px}
.week .today i{background:var(--primary)}
.week .zero i{background:var(--subtle)}
.done-row{display:flex;gap:12px;align-items:center;padding:10px 0}
.tick{width:32px;height:32px;border-radius:50%;background:var(--mint-soft);color:var(--mint-ink);display:grid;place-items:center;flex:none}

/* path */
.mod{padding:0;overflow:hidden}
.mod-h{display:flex;gap:16px;align-items:center;padding:22px 28px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.mod-n{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font:800 20px var(--display)}
.track{position:relative;margin:0 auto;max-width:640px;width:100%}
.track svg.curve{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pn{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:190px;text-align:center}
.pn .circ{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;transition:transform .12s;border:0}
.pn:hover .circ{transform:translateY(-3px)}
.pn .lbl{font-weight:700;font-size:14px;line-height:1.25}
.callout{position:absolute;transform:translate(-50%,-100%);background:var(--text);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-weight:600;font-size:13px;white-space:nowrap;box-shadow:var(--shadow-pop);z-index:2}
.callout:after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--text);transform:translateX(-50%) rotate(45deg)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block}

/* instruments */
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:600;font-size:13px;color:var(--text2)}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.icard{padding:16px;display:flex;flex-direction:column;gap:12px}
.icard .pic{border-radius:16px;overflow:hidden;aspect-ratio:200/132}
.icard .pic svg{width:100%;height:100%}
.lvl-e{color:var(--mint-ink)}.lvl-m{color:var(--yellow-ink)}.lvl-f{color:var(--primary-ink)}
.crumb{display:flex;gap:8px;align-items:center;color:var(--muted);font-weight:600;font-size:13px}
.crumb button{display:inline-flex;gap:8px;align-items:center;color:var(--muted)}
.crumb button:hover{color:var(--text)}
.goal{display:flex;gap:12px;align-items:center;font-size:16px}
.lrow{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--border);text-align:left;width:100%}
.lrow:first-of-type{border-top:0}
.num{width:36px;height:36px;border-radius:12px;background:var(--subtle);display:grid;place-items:center;font-weight:700;color:var(--text2);flex:none}
.playc{width:36px;height:36px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}

/* theory / ear */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.tcard{display:flex;flex-direction:column;gap:12px;text-align:left;padding:20px;transition:transform .15s,border-color .15s;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow)}
.tcard:hover{transform:translateY(-2px);border-color:var(--primary)}
.tic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center}
.demo{display:flex;gap:12px;align-items:flex-start;background:var(--yellow-soft);color:var(--yellow-ink);border-radius:16px;padding:14px 18px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.act{text-align:left;padding:20px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:2px solid var(--border);border-radius:24px;box-shadow:var(--shadow)}
.act[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.player{display:flex;gap:16px;align-items:center;background:var(--subtle);border-radius:18px;padding:16px 20px;flex:1;min-width:230px}
.playbtn{width:48px;height:48px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none;box-shadow:0 3px 0 var(--primary-shadow)}
.wave{display:flex;gap:3px;align-items:center;margin-left:auto}
.wave i{display:block;width:4px;border-radius:4px;background:var(--strong)}
.playing .wave i{background:var(--primary);animation:wv .5s infinite alternate}
.playing .wave i:nth-child(even){animation-delay:.2s}
@keyframes wv{to{transform:scaleY(.35)}}
.opts{display:flex;gap:12px;flex-wrap:wrap}
.opt{border:2px solid var(--border);background:var(--surface);border-radius:16px;padding:13px 20px;font-weight:700;border-bottom-width:4px}
.opt:hover{border-color:var(--primary)}
.opt.ok{background:var(--mint-soft);border-color:var(--mint);color:var(--mint-ink)}
.opt.bad{background:var(--error-soft);border-color:var(--error);color:var(--error-ink)}
.rhy{display:flex;gap:4px;height:34px;width:100%;min-width:140px}
.rhy span{border-radius:8px;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;font-size:11px;font-weight:700;border:1.5px solid var(--primary)}

/* progress */
.stats4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.achs{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px}
.ach{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:14px 8px}
.ach.off{opacity:.55}
.ach .c{width:60px;height:60px;border-radius:50%;display:grid;place-items:center}
.mrow{display:flex;flex-direction:column;gap:6px}

/* lesson */
.lesson{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;overflow:auto}
.lh{display:flex;align-items:center;gap:20px;padding:16px max(24px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--border);background:var(--surface)}
.lh .ttl{min-width:0}
.lh .ttl b{display:block;font-family:var(--display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:8px;flex:1;max-width:560px;margin:0 auto}
.steps i{flex:1;height:10px;border-radius:99px;background:var(--subtle);position:relative;overflow:hidden}
.steps i b{position:absolute;top:0;bottom:0;left:0;background:var(--primary);width:0;border-radius:99px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.steps i.on b{width:100%}
.lbody{flex:1;display:flex;justify-content:center;padding:36px 24px 28px}
.lin{width:100%;max-width:860px;display:flex;flex-direction:column;gap:22px}
.lf{position:sticky;bottom:0;border-top:1px solid var(--border);background:var(--surface);padding:16px 24px}
.lf.ok{background:var(--mint-soft);border-color:var(--mint)}
.lf.bad{background:var(--error-soft);border-color:var(--error)}
.lfi{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.fb{display:flex;gap:14px;align-items:flex-start;flex:1;min-width:240px}
.fb .fi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.lf.ok .fi{background:var(--mint)}.lf.bad .fi{background:var(--error)}
.lf.ok .fb b{color:var(--mint-ink)}.lf.bad .fb b{color:var(--error-ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border-radius:12px;padding:9px 16px;font-weight:700;font-size:14px;background:var(--subtle);color:var(--text2)}
.tab[aria-selected="true"]{background:var(--primary);color:var(--on-primary)}
.stage{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.stage svg{width:100%;height:auto;max-height:340px}
.ans{display:flex;align-items:center;gap:14px;border:2px solid var(--border);border-bottom-width:4px;border-radius:18px;padding:14px 18px;background:var(--surface);text-align:left;width:100%;font-weight:600;font-size:16px}
.ans:hover{border-color:var(--primary)}
.ans .l{width:34px;height:34px;border-radius:10px;border:2px solid var(--border);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.pc0{--pc:var(--primary);--pct:#fff}.pc1{--pc:var(--mint);--pct:#fff}.pc2{--pc:var(--yellow);--pct:#3a2a00}.pc3{--pc:#D4568A;--pct:#fff}
.ans.pcx{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,var(--surface))}.ans.pcx .l{background:var(--pc);border-color:var(--pc);color:var(--pct)}
.ans.sel{border-color:var(--primary);background:var(--primary-soft)}.ans.sel .l{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.ans.ok{border-color:var(--mint);background:var(--mint-soft);color:var(--mint-ink)}.ans.ok .l{background:var(--mint);border-color:var(--mint);color:#fff}
.ans.bad{border-color:var(--error);background:var(--error-soft);color:var(--error-ink)}.ans.bad .l{background:var(--error);border-color:var(--error);color:#fff}
.ans.dim{opacity:.6}
.ansg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px}
.hl{background:var(--yellow-soft);color:var(--yellow-ink);padding:1px 6px;border-radius:6px;font-weight:700}
.info4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.info4>div{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px}
.ord{display:flex;align-items:center;gap:14px;border:2px solid var(--border);border-bottom-width:4px;border-radius:18px;padding:14px 18px;background:var(--surface);width:100%;text-align:left;font-weight:600}
.ord .l{width:34px;height:34px;border-radius:50%;border:2px dashed var(--strong);display:grid;place-items:center;font-weight:700;flex:none;color:var(--muted)}

/* ---------- audio (Web Audio, generated in the browser) ---------- */
let AC=null;
function ctx(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,t0,dur,vol=.22){const c=ctx();if(!c)return false;const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,c.currentTime+t0);g.gain.linearRampToValueAtTime(vol,c.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t0+dur);o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+dur+.05);return true}
const hz=m=>440*Math.pow(2,(m-69)/12);
function click(t0,acc){const c=ctx();if(!c)return false;const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=acc?1200:800;g.gain.setValueAtTime(.12,c.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t0+.07);o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+.08);return true}
function playRhythm(p,bpm=100){let t=0;const b=60/bpm;let ok=true;p.forEach((d,i)=>{ok=click(t,i===0)&&ok;t+=d*b});return ok}
function flash(id,ms){const el=document.getElementById(id);if(!el)return;el.classList.add('playing');setTimeout(()=>el.classList.remove('playing'),ms)}

function vMod(m){
  const ns=m.ids.map(node),p=modProg(m),[bg,ink]=tintOf(m.tone),ROW=150,H=ns.length*ROW+30,xs=[30,66,34,68,40,64,36,62];
  const pos=i=>[xs[i%xs.length],30+i*ROW+38];
  let segs='';
  for(let i=1;i<ns.length;i++){const[a,b]=pos(i-1),[c,d]=pos(i),reached=ns[i].st!=='locked';const my=(b+d)/2;
    segs+=`<path d="M${a} ${b}C${a} ${my},${c} ${my},${c} ${d}" fill="none" stroke="${reached?'var(--primary)':'var(--strong)'}" stroke-width="5" stroke-linecap="round" ${reached?'':'stroke-dasharray="2 12"'} vector-effect="non-scaling-stroke" style="stroke-width:5px"/>`;}
  const nodes=ns.map((n,i)=>{const[x,y]=pos(i);const cur=n.st==='current';
    return `${cur?`<div class="callout" style="left:${x}%;top:${y-46}px"><span>Du bist hier</span><span class="btn p" style="padding:7px 14px;font-size:13px;pointer-events:none;box-shadow:0 3px 0 var(--primary-shadow)">Jetzt starten</span></div>`:''}<button class="pn" style="left:${x}%;top:${y-38}px" data-a="node" data-id="${n.id}" aria-label="${esc(n.t)}, ${{done:'abgeschlossen',current:'aktuell',locked:'gesperrt',perfect:'perfekt abgeschlossen'}[n.st]}"><span class="circ ${nodeCls(n.st)}">${nodeIcon(n.st)}</span><span class="lbl">${n.bonus?'<span class="over" style="display:block">Bonus</span>':''}${esc(n.t.replace('Bonus: ',''))}</span></button>`}).join('');
  return `<section class="card mod"><div class="mod-h"><span class="mod-n" style="background:${bg};color:${ink}">${m.n}</span><div class="col" style="flex:1;min-width:200px"><span class="over">Modul ${m.n}</span><h3>${m.t}</h3></div><div class="col" style="width:220px;max-width:100%;gap:6px"><div class="row small"><b>${p} %</b><span class="sp"></span><span class="muted">abgeschlossen</span></div>${bar(p,m.tone==='mint'?'m':m.tone==='yellow'?'y':'')}</div></div>
   <div style="padding:20px 20px 30px"><div class="track" style="height:${H}px"><svg class="curve" viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true">${segs}</svg>${nodes}</div></div></section>`;
}

/* ear trainer */
const EAR=[['hl','Hoch oder tief?','Zwei Töne vergleichen und den höheren finden.','Einsteiger','mint','ear'],['int','Intervalle erkennen','Terz, Quarte, Quinte oder Oktave: Welcher Abstand erklingt?','Mittel','blue','vol'],['rhy','Rhythmen erkennen','Ein kurzes Muster hören und das passende auswählen.','Mittel','yellow','clock'],['cmp','Tonhöhen vergleichen','Sind zwei Töne gleich hoch oder verschieden?','Einsteiger','mint','ear']];
const RH=[[1,1,1,1],[1,.5,.5,1,1],[2,1,1],[.5,.5,.5,.5,2],[1,1,2],[1.5,.5,1,1]];
const rn=n=>Math.floor(Math.random()*n);
function newQ(mode){
  if(mode==='hl'){let a=55+rn(20),b=a;while(Math.abs(b-a)<2)b=55+rn(20);return{mode,a,b,ans:a>b?0:1,opts:['Ton A ist höher','Ton B ist höher'],hint:'Je höher der Ton, desto schneller schwingt die Luft. Höhere Töne klingen heller.'}}
  if(mode==='cmp'){const a=57+rn(14),same=rn(2)===0;const b=same?a:a+(rn(2)?1:-1)*(1+rn(3));return{mode,a,b,ans:same?0:1,opts:['Gleich hoch','Verschieden'],hint:'Achte darauf, ob sich der zweite Ton gegenüber dem ersten bewegt.'}}
  if(mode==='int'){const I=[['Terz',4],['Quarte',5],['Quinte',7],['Oktave',12]],k=rn(4),a=55+rn(8);return{mode,a,b:a+I[k][1],ans:k,opts:I.map(x=>x[0]),hint:'Eselsbrücke: Quinte klingt weit und offen, Quarte wie „Hoch soll er leben“, Terz weich und freundlich, Oktave wie derselbe Ton höher.'}}
  const k=rn(RH.length);let o=[k];while(o.length<3){const r=rn(RH.length);if(!o.includes(r))o.push(r)}o.sort(()=>Math.random()-.5);return{mode,pat:RH[k],ans:o.indexOf(k),optPats:o.map(i=>RH[i]),opts:['Muster 1','Muster 2','Muster 3'],hint:'Zähle die Schläge mit und achte darauf, ob zwei schnelle Töne in einen Schlag passen.'}}
function setEar(mode){S.earMode=mode;S.ear={mode,i:0,score:0,q:newQ(mode),sel:null,done:false,msg:''}}
function playQ(which){const q=S.ear.q;let ok=true;
  if(q.mode==='rhy'){ok=playRhythm(q.pat);flash('pl-A',q.pat.reduce((a,b)=>a+b,0)*600);}
  else if(which==='A'){ok=tone(hz(q.a),0,.8);flash('pl-A',800)}else if(which==='B'){ok=tone(hz(q.b),0,.8);flash('pl-B',800)}
  else{ok=tone(hz(q.a),0,.7)&&tone(hz(q.b),.8,.7);flash('pl-A',1500)}
  if(!ok){S.ear.msg='Dein Browser blockiert die Tonausgabe. Bitte Lautstärke und Berechtigungen prüfen.';paint()}}
function vEar(){
  if(!S.ear)setEar('hl');const e=S.ear,q=e.q,m=EAR.find(x=>x[0]===e.mode);
  const pl=(id,l,sub,w)=>`<button class="player" id="${id}" data-a="play" data-id="${w}" aria-label="${l} abspielen"><span class="playbtn">${ic('play',18)}</span><span class="col" style="text-align:left"><b>${l}</b><span class="small muted">${sub}</span></span><span class="wave">${[10,22,14,30,18,26,12,20,8].map(h=>`<i style="height:${h}px"></i>`).join('')}</span></button>`;
  let players='';
  if(q.mode==='hl')players=pl('pl-A','Ton A','Antippen zum Anhören','A')+pl('pl-B','Ton B','Antippen zum Anhören','B');
  else if(q.mode==='cmp')players=pl('pl-A','Beide Töne','Nacheinander anhören','AB');
  else if(q.mode==='int')players=pl('pl-A','Intervall anhören','Zwei Töne nacheinander','AB');
  else players=pl('pl-A','Rhythmus anhören','Vier Zählzeiten, 100 BPM','R');
  const answered=e.sel!==null;
  const opts=q.opts.map((o,i)=>{let c='opt';if(answered){if(i===q.ans)c+=' ok';else if(i===e.sel)c+=' bad'}
    const pv=q.mode==='rhy'?`<span class="rhy" style="margin-top:10px">${q.optPats[i].map(d=>`<span style="flex:${d}">${d===.5?'♪':d===1?'♩':d===1.5?'♩.':'𝅗𝅥'}</span>`).join('')}</span>`:'';
    return `<button class="${c}" data-a="earAns" data-id="${i}" ${answered?'disabled':''} style="${q.mode==='rhy'?'flex:1;min-width:170px;text-align:left':''}">${o}${pv}</button>`}).join('');
  return `<div><h1>Gehörbildung</h1><p class="sub">Trainiere dein Gehör mit kurzen Hörübungen.</p></div>
  <div class="demo">${ic('info',20)}<p><b>So funktioniert das Training:</b> Die Töne und Klick-Rhythmen werden live in deinem Browser erzeugt (Web Audio). Es sind einfache Synthesizer-Töne, keine Instrumentenaufnahmen. Deine Antwort wird anhand der erzeugten Aufgabe geprüft; es wird nicht in dein Mikrofon gehört.</p></div>
  <div class="acts">${EAR.map(a=>`<button class="act" aria-pressed="${a[0]===e.mode}" data-a="earMode" data-id="${a[0]}"><span class="tic" style="width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:${tintOf(a[4])[0]};color:${tintOf(a[4])[1]}">${ic(a[5],24)}</span><h4>${a[1]}</h4><span class="small" style="color:var(--text2)">${a[2]}</span><span>${badge(a[4],a[3])}</span></button>`).join('')}</div>
  <section class="card col g16" style="padding:28px">${e.done?`<div class="col g16" style="align-items:center;text-align:center;padding:12px"><div class="big" style="width:76px;height:76px">${ic('star',34)}</div><h2>${e.score} von 5 richtig</h2><p class="muted" style="max-width:420px">${e.score>=4?'Sehr gut, dein Gehör ist auf Kurs.':e.score>=2?'Guter Anfang. Wiederhole die Übung, um sicherer zu werden.':'Hör die Töne in Ruhe mehrmals an, dann klappt es besser.'}</p><div class="row wrapflex"><button class="btn p" data-a="earMode" data-id="${e.mode}">Nochmal üben</button><button class="btn s" data-a="earMode" data-id="${EAR[(EAR.findIndex(x=>x[0]===e.mode)+1)%4][0]}">Nächste Übung</button></div></div>`:`
   <div class="row wrapflex"><h2>${m[1]}</h2>${badge('neutral','Aufgabe '+(e.i+1)+' von 5')}<span class="sp"></span><span class="small muted">${e.score} richtig</span></div>
   <p style="font-size:17px;color:var(--text2)">${{hl:'Höre beide Töne nacheinander. Welcher klingt höher?',cmp:'Höre die beiden Töne. Sind sie gleich hoch?',int:'Höre die beiden Töne. Welches Intervall erklingt?',rhy:'Höre das Muster und wähle die passende Notation.'}[q.mode]}</p>
   <div class="row g16 wrapflex">${players}</div><div class="opts" role="group" aria-label="Antworten">${opts}</div>
   ${e.msg?`<p class="small" style="color:var(--error-ink)">${e.msg}</p>`:''}
   ${answered?`<div class="row wrapflex" style="padding:14px 18px;border-radius:16px;background:${e.sel===q.ans?'var(--mint-soft)':'var(--error-soft)'};color:${e.sel===q.ans?'var(--mint-ink)':'var(--error-ink)'}">${ic(e.sel===q.ans?'check':'x',20)}<div style="flex:1;min-width:200px"><b>${e.sel===q.ans?'Richtig!':'Fast. Richtig wäre: '+q.opts[q.ans]+'.'}</b><div class="small" style="margin-top:2px">${q.hint}</div></div><button class="btn p" data-a="earNext">${e.i===4?'Ergebnis ansehen':'Weiter'}</button></div>`:''}`}</section>`;
}

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">

add('m1a','Was ist Musik?',8,'Ton, Klang und Geräusch: Die Bausteine, aus denen Musik entsteht.',[

  T('Ton','Ein Ton','Ein '+hl('Ton')+' entsteht durch eine <b>regelmäßige Schwingung</b>, zum Beispiel einer Saite oder einer Luftsäule.','Je schneller die Schwingung, desto höher klingt der Ton.',()=>stage(waveV([['low','Tiefer Ton: wenige Schwingungen'],['high','Hoher Ton: viele Schwingungen','var(--mint)']]))),
  T('Klang','Ein Klang','Ein '+hl('Klang')+' besteht aus mehreren Tönen, die gemeinsam erklingen. Instrumente erzeugen immer einen Grundton und viele Obertöne.','Deshalb klingt ein Klavier anders als eine Flöte, auch bei demselben Ton.',()=>stage(waveV([['mix','Klang: Grundton plus Obertöne']]))),

  T('Bausteine','Vier Eigenschaften','Jeder Ton hat vier Eigenschaften: '+hl('Tonhöhe')+', '+hl('Tondauer')+', '+hl('Lautstärke')+' und '+hl('Klangfarbe')+'.','Damit lässt sich jede Musik beschreiben.',()=>stage(`<div class="info4">${[['Tonhöhe','hoch oder tief'],['Tondauer','lang oder kurz'],['Lautstärke','laut oder leise'],['Klangfarbe','z. B. Flöte oder Geige']].map(c=>`<div><h4>${c[0]}</h4><p class="muted">${c[1]}</p></div>`).join('')}</div>`))

add('m1e','Notenwerte und Pausen',10,'Wie lange klingt ein Ton und wie lange schweigt die Musik?',[
 intro('Töne haben eine Länge','Jede Note sagt dir nicht nur, wie hoch ein Ton ist, sondern auch, wie lange er klingt. Auch Stille ist notiert: als Pause.',['Vier Notenwerte unterscheiden','Passende Pausenzeichen kennen','Dauern berechnen'],()=>stage(staff({clef:false,w:600,notes:[{s:4,x:90,type:'w'},{s:4,x:230,type:'h'},{s:4,x:370,type:'q'},{s:4,x:510,type:'e'}]}))),
 explain('Notenwerte und Pausen',[
  T('Notenwerte','Vier Notenwerte','Die '+hl('Notenform')+' zeigt die Dauer: Die ganze Note ist leer und hat keinen Hals, die halbe ist leer mit Hals, die Viertel ist gefüllt, die Achtel hat zusätzlich eine Fahne.','In einem 4/4-Takt zählt die Viertelnote einen Schlag.',()=>stage(staff({clef:false,w:600,notes:[{s:4,x:90,type:'w',label:'Ganze: 4'},{s:4,x:230,type:'h',label:'Halbe: 2'},{s:4,x:370,type:'q',label:'Viertel: 1'},{s:4,x:510,type:'e',label:'Achtel: ½'}]}))),
  T('Pausen','Pausen','Zu jedem Notenwert gibt es ein '+hl('Pausenzeichen')+' mit derselben Dauer.','Die ganze Pause hängt an der vierten Linie, die halbe Pause sitzt auf der dritten.',()=>stage(staff({clef:false,w:600,notes:[{rest:'w',x:90,label:'Ganze: 4'},{rest:'h',x:230,label:'Halbe: 2'},{rest:'q',x:370,label:'Viertel: 1'},{rest:'e',x:510,label:'Achtel: ½'}]}))),
  T('Verhältnisse','Wie sie zusammenpassen','Jeder Wert ist die Hälfte des vorherigen: 1 ganze = 2 halbe = 4 Viertel = 8 Achtel.','Zwei Achtel dauern also so lang wie eine Viertelnote.',()=>stage(`<div class="col g12">${[[4],[2,2],[1,1,1,1],[.5,.5,.5,.5,.5,.5,.5,.5]].map(p=>rhythmV(p,{play:false,h:40})).join('')}</div>`))
 ]),

 mc('Wie viele Schläge dauert eine halbe Note?',['2','1','4','½'],0,'Eine halbe Note ist halb so lang wie eine ganze, also zwei Schläge.'),
 mc('Wie viele Achtelnoten ergeben zusammen eine halbe Note?',['4','2','8','1'],0,'Eine halbe Note hat zwei Schläge, jeder Schlag besteht aus zwei Achteln: 2 × 2 = 4.'),

 mc('Welches Zeichen ist eine Viertelpause?',[restIcon('w'),restIcon('q'),restIcon('e')],1,'Die Viertelpause sieht aus wie ein Zickzack-Zeichen und dauert einen Schlag.',{sym:true,names:['die ganze Pause','die Viertelpause','die Achtelpause']}),
 order('Ordne die Notenwerte vom längsten zum kürzesten.',['Ganze Note','Halbe Note','Viertelnote','Achtelnote']),
 summary([['Notenwerte','Ganze 4, halbe 2, Viertel 1, Achtel ½ Schlag.'],['Pausen','Jede Pause hat die gleiche Dauer wie die Note.'],['Teilen','Jeder Wert ist die Hälfte des vorherigen.'],['Rechnen','Zwei Achtel = eine Viertel.']])
],{xpMax:30});

add('m1f','Der 4/4-Takt',10,'Takt, Taktstrich und Zählzeiten: Wie Musik in gleichmäßige Abschnitte gegliedert wird.',[

 explain('Der 4/4-Takt',[
  T('Takt','Takt und Taktstrich','Ein '+hl('Taktstrich')+' trennt zwei Takte. Die Taktangabe am Anfang sagt dir, wie ein Takt aufgebaut ist.','Bei 4/4 sagt die obere Zahl: vier Schläge pro Takt. Die untere: Jeder Schlag ist eine Viertelnote.',()=>stage(staff({w:620,time:[4,4],bars:[360,560],notes:[{s:4,x:180},{s:4,x:240},{s:4,x:300},{s:4,x:420},{s:4,x:480},{s:4,x:540}].slice(0,3).concat([{s:4,x:420},{s:4,x:470},{s:4,x:520}]).slice(0,6)}))),
  T('Zählzeiten','Zählzeiten','Du zählst in jedem Takt <b>eins, zwei, drei, vier</b>. Jede Zahl ist eine Zählzeit.','Zähle immer gleichmäßig, wie ein Metronom.',()=>stage(rhythmV([1,1,1,1],{play:true}))),
  T('Betonung','Betonung','Im 4/4-Takt wird die '+hl('Eins')+' am stärksten betont. Die Drei bekommt eine mittlere Betonung, die Zwei und die Vier sind leicht.','Das Muster heißt: schwer, leicht, halbschwer, leicht.',()=>stage(`<div class="week" style="height:150px">${[['1',100],['2',40],['3',70],['4',40]].map(b=>`<div><i style="height:${b[1]}px;background:var(--primary)"></i>${b[0]}</div>`).join('')}</div>`))
 ]),
 example('Was passt in einen 4/4-Takt?',[['Eine ganze Note','4 Schläge, voller Takt.'],['Zwei halbe Noten','2 + 2 = 4 Schläge.'],['Viertel, Viertel, halbe','1 + 1 + 2 = 4 Schläge.']],r=>stage(`<div class="col g12">${[[4],[2,2],[1,1,2]].slice(0,r).map(p=>rhythmV(p,{play:false,h:40})).join('')}</div>`)),
 mc('Was bedeutet die obere Zahl im 4/4-Takt?',['Vier Schläge pro Takt','Vier Takte insgesamt','Vier Noten pro Zeile','Vier Pausen'],0,'Die obere Zahl gibt die Anzahl der Schläge pro Takt an.'),
 mc('Welche Zählzeit wird im 4/4-Takt meist am stärksten betont?',['Die Eins','Die Zwei','Die Drei','Die Vier'],0,'Die Eins ist die schwerste Zählzeit.'),
 mc('Welcher Takt ist voll (4 Schläge)?',[rhythmV([2,1,1],{play:false,h:36}),rhythmV([2,2,1],{play:false,h:36}),rhythmV([1,1,1],{play:false,h:36})],0,'Halbe (2) + Viertel (1) + Viertel (1) = 4 Schläge.',{optHtml:true,names:['der erste Takt (2 + 1 + 1)','der zweite Takt','der dritte Takt']}),
 match([['4/4','Vier Viertelschläge pro Takt'],['Taktstrich','Trennt zwei Takte'],['Zählzeit 1','Wird meist betont'],['Doppelstrich','Markiert das Ende eines Abschnitts']]),
 summary([['Takt','Musik wird in gleich lange Abschnitte gegliedert.'],['4/4','Vier Viertelschläge pro Takt.'],['Betonung','Die Eins ist am stärksten, die Drei halbschwer.'],['Rechnen','Alle Notenwerte in einem Takt ergeben zusammen 4 Schläge.']])
],{xpMax:30});

add('m2a','Die C-Dur-Tonleiter',12,'Acht Töne, nur weiße Tasten: der Grundstein aller Tonleitern.',[

 explain('Die C-Dur-Tonleiter',[
  T('Im Notensystem','Im Notensystem','C-Dur besteht aus den Tönen '+hl('c d e f g a h c')+'. Das erste und das letzte c haben denselben Namen, der Abstand heißt Oktave.','Das tiefe c steht auf einer Hilfslinie unter dem System.',()=>stage(staff({w:620,notes:scaleNotes(true,150,58)}))),
  T('Auf der Klaviatur','Auf der Klaviatur','Auf dem Klavier spielst du C-Dur nur auf '+hl('weißen Tasten')+'. Beginne links neben der Zweiergruppe der schwarzen Tasten.','Die schwarzen Tasten brauchst du für C-Dur nicht.',()=>stage(keyboardV({hi:[0,1,2,3,4,5,6,7]}))+`<div class="row wrapflex">${[60,62,64,65,67,69,71,72].map((m,i)=>toneBtn(m,['c','d','e','f','g','a','h','c'][i])).join('')}</div>`),
  T('Stufen','Stufen','Jeder Ton hat eine '+hl('Stufe')+': c ist die erste, d die zweite und so weiter bis zur achten.','Der erste Ton heißt Grundton.',()=>stage(keyboardV({numbers:true})))
 ]),
 example('Stufen zählen',[['c ist die 1. Stufe','Der Grundton.'],['e ist die 3. Stufe','c, d, e: drei Stufen.'],['g ist die 5. Stufe','c, d, e, f, g: fünf Stufen.']],r=>stage(keyboardV({hi:r===1?[0]:r===2?[0,2]:[0,4],numbers:true}))),
 mc('Aus welchen Tasten besteht C-Dur?',['Nur aus weißen Tasten','Nur aus schwarzen Tasten','Aus weißen und schwarzen im Wechsel','Nur aus der linken Hälfte'],0,'C-Dur kommt ohne schwarze Tasten aus.'),
 mc('Welcher Ton folgt in C-Dur auf f?',['g','e','a','h'],0,'Die Reihenfolge ist c d e f g a h c.'),
 order('Ordne die Töne der C-Dur-Tonleiter von unten nach oben.',['c','d','e','f','g']),
 match([['Grundton','Der erste Ton einer Tonleiter'],['Oktave','Der achte Ton, gleicher Name wie der erste'],['Tonleiter','Töne, nach Höhe geordnet'],['Stufe','Position eines Tons in der Tonleiter']]),
 summary([['Töne','c d e f g a h c.'],['Weiße Tasten','C-Dur braucht keine schwarzen Tasten.'],['Stufen','Acht Stufen, Grundton ist c.'],['Oktave','Der achte Ton ist wieder ein c.']],()=>stage(keyboardV({numbers:true})))
],{xpMax:30});

add('m2b','Ganze und halbe Töne',10,'Warum klingt C-Dur so, wie es klingt? Es liegt an den Abständen zwischen den Tönen.',[
 intro('Kleine und große Schritte','Nicht alle Schritte in einer Tonleiter sind gleich groß. Es gibt Halbtonschritte und Ganztonschritte.',['Halbton und Ganzton unterscheiden','Halbtonschritte in C-Dur finden','Das Dur-Muster kennen'],()=>stage(keyboardV({steps:true}))),
 explain('Halbton und Ganzton',[
  T('Halbton','Der Halbton','Ein '+hl('Halbton')+' ist der kleinste Abstand auf dem Klavier: von einer Taste zur nächsten, egal ob weiß oder schwarz.','Zwischen e–f und h–c liegt keine schwarze Taste. Darum sind das Halbtonschritte.',()=>stage(keyboardV({hi:[2,3],steps:true}))),
  T('Ganzton','Der Ganzton','Ein '+hl('Ganzton')+' besteht aus zwei Halbtonschritten. Zwischen c und d liegt eine schwarze Taste.','Alle anderen Schritte in C-Dur sind Ganztöne.',()=>stage(keyboardV({hi:[0,1],steps:true}))),
  T('Dur-Muster','Das Dur-Muster','Jede Durtonleiter folgt demselben Muster: '+hl('G G H G G G H')+' (G = Ganzton, H = Halbton).','Wenn du das Muster kennst, kannst du Dur auf jedem Ton bauen.',()=>stage(keyboardV({steps:true})))
 ]),

 mc('Zwischen welchen Tönen liegt in C-Dur ein Halbton?',['e–f und h–c','c–d und d–e','f–g und g–a','a–h und c–d'],0,'Nur zwischen e und f sowie zwischen h und c fehlt die schwarze Taste.'),
 mc('Wie viele Halbtonschritte hat ein Ganzton?',['2','1','3','4'],0,'Ein Ganzton besteht aus zwei Halbtonschritten.'),
 mc('Welches Muster hat jede Durtonleiter?',['G G H G G G H','G H G G H G G','H G G G H G G','G G G H G G H'],0,'Das Dur-Muster lautet Ganz, Ganz, Halb, Ganz, Ganz, Ganz, Halb.'),
 match([['Halbton','Kleinster Abstand auf dem Klavier'],['Ganzton','Zwei Halbtonschritte'],['e–f','Halbtonschritt in C-Dur'],['c–d','Ganztonschritt in C-Dur']]),
 summary([['Halbton','Von Taste zu Taste.'],['Ganzton','Zwei Halbtöne.'],['C-Dur','Halbtöne bei e–f und h–c.'],['Dur-Muster','G G H G G G H.']])
],{xpMax:30});

  const W=[1,2,3,4,5,6].map(n=>n<no?100:n===no?(ex?Math.round((gp+1)/(grp.length+1)*100):50):0);const prev=lastW;lastW=W;pendingW=W;const segs=[1,2,3,4,5,6].map((n,i)=>`<i><b style="width:${prev[i]}%"></b></i>`).join('');
  const back=L.i>0?`<button class="btn s" data-a="lback">Zurück</button>`:'<span></span>';
  const last=L.i===les.steps.length-1;
  let foot;
  if(fb)foot=`<div class="lf ${fb[0]?'ok':'bad'}"><div class="lfi"><div class="fb"><span class="fi">${ic(fb[0]?'check':'x',24)}</span><div><b style="font-size:18px">${fb[1]}</b><p style="margin-top:2px;color:var(--text)">${fb[2]}</p></div></div>${!fb[0]&&s.t==='tap'?`<button class="btn s" data-a="tapagain">Nochmal versuchen</button>`:''}<button class="btn ${fb[0]?'g':'p'} lg" data-a="lnext">Weiter</button></div></div>`;
  else if(ex)foot=`<div class="lf"><div class="lfi">${back}<span class="sp"></span><button class="btn p lg" data-a="check" ${ready(L.i)?'':'disabled'}>Überprüfen</button></div></div>`;
  else foot=`<div class="lf"><div class="lfi">${back}<span class="sp"></span><button class="btn ${last?'g':'p'} lg" data-a="${last?'finish':'lnext'}">${last?'Lektion abschließen':'Weiter'}</button></div></div>`;
  return `<div class="lesson" role="dialog" aria-label="Lektion: ${esc(les.title)}"><header class="lh"><button class="iconbtn" data-a="lexit" aria-label="Zurück">${ic('left',20)}</button><div class="ttl"><span class="over">${esc(kickerOf(les))}</span><b>${esc(les.title)}</b></div><div class="steps" aria-label="Schritt ${no} von 6">${segs}</div><span class="small muted" style="white-space:nowrap">Schritt ${no} von 6</span><button class="iconbtn" data-a="lexit" aria-label="Lektion beenden">${ic('x',20)}</button></header>
   <div class="lbody"><div class="lin" id="lin">${lessonBody(L.i)}</div></div>${foot}</div>`;
}
function stats(){const L=S.L,ex=exIdx(),c=ex.filter(i=>exs(i).ok).length,n=ex.length||1,first=!S.done[L.id],base=20+Math.round(c/n*(L.les.xpMax||30));return{c,n,acc:Math.round(c/n*100),xp:first?base:Math.round(base/2),first,min:Math.max(1,Math.round((Date.now()-L.t0)/60000))}}
function backLabel(f){return f.view==='instrument'?'Zu '+f.inst:f.view==='theory'?'Zur Musiktheorie':f.view==='home'?'Zur Startseite':'Zum Lernpfad'}
function nextOf(les){
  const idx=S.nodes.findIndex(x=>x.id===les.id);
  if(idx>=0){const nx=S.nodes[idx+1];return nx&&nx.st!=='locked'?{id:nx.id,t:nx.t}:null}
  if(les.inst){const nx=LESSONS['i|'+les.inst+'|'+(les.idx+1)];return nx?{id:nx.id,t:nx.title}:null}
  return null}
function lessonDone(){const L=S.L,les=L.les,s=L.res||stats(),nx=nextOf(les),f=L.from||{view:'path'};
  const steps=[1,2,3,4,5,6].map(()=>'<i><b style="width:100%"></b></i>').join('');
  return `<div class="lesson" role="dialog" aria-label="Lektion abgeschlossen"><header class="lh"><button class="iconbtn" data-a="backpath" aria-label="Schließen">${ic('x',20)}</button><div class="ttl"><span class="over">${esc(kickerOf(les))}</span><b>${esc(les.title)}</b></div><div class="steps">${steps}</div></header>
 <div class="lbody"><div class="lin done-screen"><div class="big">${ic('check',46)}</div><div><h1>Lektion geschafft!</h1><p class="sub">${s.acc===100?'Alles richtig. Das ist eine perfekte Runde.':s.acc>=60?'Stark gemacht. Wiederhole die Lektion, wenn du alles richtig haben möchtest.':'Geschafft! Eine Wiederholung hilft, den Stoff zu festigen.'}</p></div>
 <div class="rs"><div><span class="over">Verdient</span><b style="color:var(--primary)">+${s.xp} XP</b>${s.first?'':'<span class="small muted">Wiederholung: halbe XP</span>'}</div><div><span class="over">Genauigkeit</span><b>${s.acc} %</b><span class="small muted">${s.c} von ${s.n} Aufgaben richtig</span></div><div><span class="over">Lernserie</span><b>${S.streak} Tage</b><span class="small muted">Weiter so!</span></div></div>
 ${nx&&s.first?`<div class="card" style="width:100%;text-align:left;display:flex;gap:16px;align-items:center;flex-wrap:wrap"><span class="tic" style="width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)">${ic('map',24)}</span><div style="flex:1;min-width:200px"><b>${S.nodes.some(x=>x.id===les.id)?'Nächste Lektion freigeschaltet':'Als Nächstes'}</b><p class="muted">${esc(nx.t)}</p></div>${S.nodes.some(x=>x.id===les.id)?badge('mint','Modul 1: '+modProg(MODS[0])+' %'):''}</div>`:''}</div></div>
 <div class="lf"><div class="lfi"><button class="btn s" data-a="again">${ic('repeat',16)}Wiederholen</button><span class="sp"></span><button class="btn ${nx?'s':'p'} lg" data-a="backpath">${backLabel(f)}</button>${nx?`<button class="btn p lg" data-a="start" data-id="${esc(nx.id)}">Nächste Lektion ${ic('right',18)}</button>`:''}</div></div></div>`}
function confetti(){const cols=['#2F5BEA','#1FA77D','#F2B33D','#D64545','#8AA3FF'];for(let i=0;i<46;i++){const e=document.createElement('div');e.className='cf';e.style.left=(Math.random()*100)+'vw';e.style.background=cols[i%5];e.style.setProperty('--dx',(Math.random()*160-80)+'px');e.style.setProperty('--d',(1.8+Math.random()*1.6)+'s');e.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4200)}}
function countUp(){const el=document.querySelector('.rs b');if(!el)return;const t=parseInt(el.textContent.replace(/\D/g,''))||0,t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/900);el.textContent='+'+Math.round(t*k)+' XP';if(k<1)requestAnimationFrame(f)})(t0)}
const THL={noten:'m1c',werte:'m1e',pausen:'tpausen',takt:'m1f',tonleiter:'m2a',intervalle:'m2c',akkorde:'takkorde',rhythmus:'m3a'};
function applyDone(){const L=S.L,les=L.les,s=stats(),n=node(les.id);L.res=s;
  S.xp+=s.xp;
  if(s.first){S.done[les.id]=1;S.lessons+=1;S.prog=Math.min(100,S.prog+(n?3:1));
    if(n){n.st=s.acc===100?'perfect':'done';const idx=S.nodes.indexOf(n),nx=S.nodes[idx+1];if(nx&&nx.st==='locked')nx.st='current'}
    const th=TH.find(t=>THL[t.id]===les.id);if(th)th.p=100}
  else if(n&&s.acc===100&&n.st==='done')n.st='perfect';
  S.hist.unshift([les.title,'Heute · '+s.acc+' %','+'+s.xp+' XP']);S.hist=S.hist.slice(0,8);S.week[6][1]+=Math.max(s.min,8)}
function leaveLesson(){const f=(S.L&&S.L.from)||{view:'path'};S.L=null;S.view=f.view==='instrument'&&!f.inst?'instruments':f.view;if(f.inst)S.inst=f.inst;paint();window.scrollTo(0,0)}
function lessonAct(a,el,id){const L=S.L;
  switch(a){
   case'lexit':case'backpath':leaveLesson();return true;
   case'lback':L.i=Math.max(0,L.i-1);L.tab=0;L.rev=1;paint();return true;
   case'lnext':L.i=Math.min(L.les.steps.length-1,L.i+1);L.tab=0;L.rev=1;paint();return true;
   case'tab':L.tab=+id;paint(true);return true;
   case'rev':L.rev=Math.min(lsteps()[L.i].rows.length,L.rev+1);paint(true);return true;
   case'pick':exs(L.i).sel=+id;paint(true);return true;
   case'mt':{const e=exs(L.i),t=+id;const was=e.pairs[t]!==undefined;if(was)delete e.pairs[t];
     if(e.d!=null&&!was){for(const k in e.pairs)if(e.pairs[k]===e.d)delete e.pairs[k];e.pairs[t]=e.d;e.d=null;e.t=null}else e.t=was?null:(e.t===t?null:t);paint(true);return true}
   case'md':{const e=exs(L.i),d=+id;const by=Object.keys(e.pairs).find(k=>e.pairs[k]===d);
     if(e.t!=null&&by===undefined){e.pairs[e.t]=d;e.t=null;e.d=null}else if(by!==undefined){delete e.pairs[by];e.d=null;e.t=null}else e.d=(e.d===d?null:d);paint(true);return true}
   case'ord':{const e=exs(L.i),s=+id,p=e.seq.indexOf(s);if(p>=0)e.seq.splice(p,1);else e.seq.push(s);paint(true);return true}
   case'tap':{const e=exs(L.i),s=lsteps()[L.i];if(e.checked||e.taps.length>=s.pat.length)return true;e.taps.push(performance.now());click(0,e.taps.length===1);
     const d=document.querySelector('.tdots');if(d)d.innerHTML=tapDots(s,e);const cb=document.querySelector('[data-a=check]');if(cb)cb.disabled=!ready(L.i);const rb=document.querySelector('[data-a=tapreset]');if(rb)rb.disabled=false;return true}
   case'tapreset':{const e=exs(L.i);e.taps=[];paint(true);return true}
   case'tapagain':{const e=exs(L.i);e.taps=[];e.checked=false;e.ok=false;paint(true);return true}
   case'check':check(L.i);paint(true);return true;
   case'finish':applyDone();L.done=true;paint();confetti();countUp();return true;
   case'again':startLesson(L.id);return true;
  }
  return false}

/* ---------- shell & paint ---------- */
const TITLES={home:'Startseite',path:'Lernpfad',instruments:'Instrumente',instrument:'Instrumente',theory:'Musiktheorie',ear:'Gehörbildung',progress:'Fortschritt'};
const IDX=[...Object.values(LESSONS).filter(l=>!l.inst).map(l=>[l.title,'Lektion',l.id]).filter(x=>node(x[2])),['Der 4/4-Takt','Thema','takt'],['Intervalle erkennen','Thema','intervalle'],...INS.map(i=>[i.n,'Instrument',i.n])];
function results(){const q=S.q.trim().toLowerCase();if(!q)return'';const r=IDX.filter(x=>x[0].toLowerCase().includes(q)).slice(0,6);return `<div class="results" role="listbox">${r.length?r.map(x=>`<button data-a="goto" data-id="${esc(x[2])}" data-kind="${x[1]}"><span>${esc(x[0])}</span><span class="small muted">${x[1]}</span></button>`).join(''):'<p class="small muted" style="padding:10px 12px">Keine Treffer</p>'}</div>`}
function menuHtml(){
  if(S.menu==='me')return `<div class="pop" role="menu"><div class="hd"><span class="av">MM</span><div class="col"><b>Max Mustermann</b><span class="small muted">Klasse 9b · Demo-Schüler</span></div></div><hr><button class="it" data-a="demo" role="menuitem">${ic('user',18)}Mein Profil</button><button class="it" data-a="nav" data-v="progress" role="menuitem">${ic('chart',18)}Mein Fortschritt</button><button class="it" data-a="demo" role="menuitem">${ic('gear',18)}Einstellungen</button><button class="it" data-a="demo" role="menuitem">${ic('help',18)}Hilfe</button><hr><button class="it" data-a="demo" role="menuitem">${ic('out',18)}Abmelden</button></div>`;
  if(S.menu==='bell')return `<div class="pop" role="menu"><div class="hd"><b>Benachrichtigungen</b></div>${[['Neue Lektion verfügbar','Notenschlüssel erkennen wartet auf dich.'],['5 Tage Serie','Du lernst seit fünf Tagen in Folge.'],['Neues Instrument','Querflöte hat jetzt 11 Lektionen.']].map(n=>`<div class="done-row" style="padding:10px 12px"><span class="tick" style="background:var(--primary-soft);color:var(--primary)">${ic('bell',15)}</span><div class="col"><b style="font-size:14px">${n[0]}</b><span class="small muted">${n[1]}</span></div></div>`).join('')}</div>`;
  return''}
function topHtml(){return `<header class="top"><div class="search">${ic('search',18)}<input id="q" type="search" placeholder="Lektionen, Themen, Instrumente suchen …" value="${esc(S.q)}" autocomplete="off" aria-label="Suche"><div id="res">${results()}</div></div><span class="sp"></span><span class="pill y">${ic('flame',14)}${S.streak} Tage Serie</span>
   <div class="menuwrap"><button class="iconbtn" data-a="menu" data-id="bell" aria-label="Benachrichtigungen" aria-expanded="${S.menu==='bell'}">${ic('bell',20)}<span class="dot"></span></button>${S.menu==='bell'?menuHtml():''}</div>
   <div class="menuwrap"><button class="me" data-a="menu" data-id="me" aria-haspopup="menu" aria-expanded="${S.menu==='me'}"><span class="av">MM</span><span class="nm">Max Mustermann</span>${ic('down',16)}</button>${S.menu==='me'?menuHtml():''}</div></header>`}
function repaintTop(){const t=document.querySelector('.top');if(t)t.outerHTML=topHtml();else paint(true)}
function shell(){
  const v=S.view,cur=v==='instrument'?'instruments':v;
  const body={home:vHome,path:vPath,instruments:vInstruments,instrument:vInstrument,theory:vTheory,ear:vEar,progress:vProgress}[v]();
  return `<div class="app"><aside class="side" aria-label="Hauptnavigation"><div class="logo"><i>${ic('music',18)}</i><span>RBR<b>.edu</b></span></div>${NAV.map(n=>`<button class="nav" data-a="nav" data-v="${n[0]}" ${cur===n[0]?'aria-current="page"':''} title="${n[1]}">${ic(n[2],20)}<span>${n[1]}</span></button>`).join('')}<div class="klasse"><span class="over">Klasse 9b</span><b>Musik bei Frau Lehmann</b></div></aside>
  <div style="min-width:0">${topHtml()}
   <main class="main" id="main">${body}</main></div></div>`}
function overlay(){
  let h='';
  if(S.dialog){const d=S.dialog;h+=`<div class="scrim" data-a="closeScrim"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(d.t)}"><div class="row"><h2 style="flex:1">${esc(d.t)}</h2><button class="iconbtn" data-a="close" aria-label="Schließen">${ic('x',18)}</button></div>${d.html}<div class="row wrapflex" style="justify-content:flex-end">${d.act.map(a=>`<button class="btn ${a[2]}" data-a="${a[1]}" data-id="${esc(a[3]||'')}">${a[0]}</button>`).join('')}</div></div></div>`}
  if(S.toast)h+=`<div class="toast" role="status">${esc(S.toast)}</div>`;return h}
let lastOv='';function paintOverlay(){const h=overlay();if(h===lastOv)return;lastOv=h;document.getElementById('ov').innerHTML=h}
let lastKey='',lastW=[0,0,0,0,0,0],pendingW=null;
function paint(keepScroll){
  const root=document.getElementById('root');
  const sc=document.querySelector('.lesson')?.scrollTop;
  root.innerHTML=S.L?vLesson():shell();
  const key=S.view+'|'+(S.inst||'')+'|'+(S.L?'L'+S.L.id+S.L.i+(S.L.done?'d':''):'')+'|'+(S.earMode&&S.view==='ear'?S.ear&&S.ear.done:'');
  root.classList.toggle('anim',key!==lastKey&&!keepScroll);if(key!==lastKey&&!keepScroll)lastKey=key;
  const ls=document.querySelector('.lesson');if(ls&&sc&&keepScroll)ls.scrollTop=sc;
  paintOverlay();
  if(pendingW){const w=pendingW;pendingW=null;requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.steps i b').forEach((b,i)=>b.style.width=w[i]+'%')))}
}
document.body.insertAdjacentHTML('beforeend','<div id="ov"></div>');
const paintAll=paint;
function go(v,id){S.view=v;S.menu=null;S.q='';if(v==='instrument')S.inst=id;if(v==='ear'&&!S.ear)setEar('hl');paint();window.scrollTo(0,0)}
function act(a,el){
  const id=el.dataset.id,L=S.L;
  switch(a){
   case'nav':return go(el.dataset.v);
   case'menu':S.menu=S.menu===id?null:id;return repaintTop();
   case'demo':S.menu=null;repaintTop();return toast('Im Demo nicht verfügbar. Du bist als Demo-Schüler angemeldet.');
   case'start':S.menu=null;return id&&node(id)?onNode(id):startLesson(id);
   case'startLesson':return startLesson(id);
   case'node':return onNode(id);
   case'cat':S.cat=id;return paint();
   case'inst':return go('instrument',id);
   case'instStart':{const k=[0,1,2,3].find(k=>!S.done['i|'+S.inst+'|'+k]);return startLesson('i|'+S.inst+'|'+(k===undefined?0:k))}
   case'instLesson':return startLesson('i|'+S.inst+'|'+id);
   case'saveInst':return toast('Zur Merkliste hinzugefügt (nur in dieser Demo-Sitzung).');
   case'theory':return theoryDialog(id);
   case'close':S.dialog=null;return paintOverlay();
   case'closeScrim':return;
   case'tone':if(!tone(hz(+id),0,.9))toast('Dein Browser blockiert die Tonausgabe. Bitte Lautstärke prüfen.');return;
   case'rplay':{const p=(el.dataset.pat||'1,1,1,1').split(',').map(Number);if(!playRhythm(p))toast('Dein Browser blockiert die Tonausgabe. Bitte Lautstärke prüfen.');return}
   case'goto':{const k=el.dataset.kind;S.q='';if(k==='Instrument')return go('instrument',id);if(k==='Thema'){go('theory');return theoryDialog(id)}go('path');return onNode(id)}
   case'earMode':setEar(id);return paint();
   case'play':return playQ(id);
   case'earAns':{const e=S.ear;if(e.sel!==null)return;e.sel=+id;e.msg='';if(e.sel===e.q.ans)e.score++;return paint(true)}
   case'earNext':{const e=S.ear;if(e.i===4){e.done=true}else{e.i++;e.q=newQ(e.mode);e.sel=null;e.msg=''}return paint()}
   default:if(L)return lessonAct(a,el,id);
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(el&&el.dataset.a==='closeScrim'){if(e.target===el){S.dialog=null;paintOverlay()}return}
  if(el&&!el.disabled){e.preventDefault();act(el.dataset.a,el);return}
  if(S.menu&&!e.target.closest('.menuwrap')){S.menu=null;repaintTop()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;document.getElementById('res').innerHTML=results()}});
document.addEventListener('keydown',e=>{if(e.key===' '&&S.L&&!S.L.done&&lsteps()[S.L.i].t==='tap'&&!e.repeat&&e.target.tagName!=='BUTTON'){e.preventDefault();act('tap',{dataset:{}});return}
  if(e.key==='Escape'){if(S.dialog){S.dialog=null;paintOverlay()}else if(S.menu){S.menu=null;repaintTop()}}});
setEar('hl');paint();
</script>
